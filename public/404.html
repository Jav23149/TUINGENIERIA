<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>TU INGENIERIA</title>
    <script>
      // Redirección SPA para GitHub Pages (proyecto en subcarpeta /TUINGENIERIA/).
      // Conserva la ruta relativa codificándola en el query string para que
      // index.html la restaure antes de que arranque el router.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
